<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor de Redação com IA</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --light-color: #f5f7fa;
            --dark-color: #333;
            --border-color: #ddd;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --error-color: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .left-panel {
            width: 25%;
            background-color: white;
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .left-panel h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .redacoes-container {
            flex: 1;
            overflow-y: auto;
        }

        .redacao-item {
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .redacao-item:hover {
            background-color: #f0f4f8;
        }

        .redacao-item.active {
            border-color: var(--primary-color);
            background-color: #e8f0fe;
        }

        .redacao-item h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .redacao-item p {
            font-size: 14px;
            color: #666;
        }

        .redacao-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            gap: 8px;
        }

        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s ease;
        }

        .delete-btn {
            background-color: var(--error-color);
            color: white;
        }

        .center-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .input-toggle {
            display: flex;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            overflow: hidden;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            background-color: #fff;
            border: none;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            color: var(--primary-color);
        }

        .toggle-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        #text-input-area {
            display: none;
            width: 100%;
            height: 200px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 20px;
            resize: vertical;
        }

        .upload-area.file-selected {
            border-color: var(--success-color);
            background-color: #f0fff4;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
        }

        .upload-area i {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .options-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .options-left {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .model-select, #ufsc-genre-input {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: white;
            font-size: 16px;
        }

        .submit-btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
            white-space: nowrap;
        }

        .submit-btn:hover {
            background-color: var(--secondary-color);
        }

        .submit-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .result-area {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background-color: white;
            overflow-y: auto;
        }

        .result-title {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .criteria-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .criteria-item:last-child {
            border-bottom: none;
        }
        
        .criteria-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .criteria-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .criteria-score {
            display: inline-block;
            padding: 3px 8px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 3px;
            font-size: 14px;
        }

        .criteria-comment {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
            white-space: pre-wrap;
        }

        .total-score {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--primary-color);
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
            text-align: center;
        }

        .right-panel {
            width: 25%;
            background-color: white;
            border-left: 1px solid var(--border-color);
            padding: 20px;
        }

        .right-panel h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        .loading { display: none; text-align: center; padding: 20px; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); border-left-color: var(--primary-color); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-message { color: var(--error-color); padding: 10px; background-color: #f8d7da; border: 1px solid var(--error-color); border-radius: 5px; margin-bottom: 15px; display: none; }
        .empty-state { text-align: center; padding: 30px; color: #666; }
        .empty-state i { font-size: 48px; margin-bottom: 15px; display: block; }

        .api-config { margin-top: 20px; padding: 15px; background-color: #f8f9fa; border-radius: 5px; }
        .api-config h3 { margin-bottom: 10px; font-size: 16px; }
        .api-config input { width: 100%; padding: 8px 10px; border: 1px solid var(--border-color); border-radius: 5px; margin-bottom: 10px; }
        .api-config button { padding: 8px 15px; background-color: var(--primary-color); color: white; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>

<body>
    <div class="container">
        <div class="left-panel">
            <h2>Minhas Redações</h2>
            <div class="redacoes-container" id="redacoes-list"></div>
        </div>

        <div class="center-panel">
            <div class="input-toggle">
                <button class="toggle-btn active" id="toggle-upload">Upload de Imagem</button>
                <button class="toggle-btn" id="toggle-text">Digitar Texto</button>
            </div>
            
            <div id="upload-container">
                <div class="upload-area" id="upload-area">
                    <i id="upload-icon">📄</i>
                    <h3 id="upload-title">Fazer upload de uma redação</h3>
                    <p id="upload-text">Arraste um arquivo de imagem aqui ou clique para selecionar</p>
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                </div>
            </div>

            <textarea id="text-input-area" placeholder="Cole ou digite sua redação aqui..."></textarea>
            
            <div class="options-bar">
                <div class="options-left">
                    <select class="model-select" id="model-select">
                        <option value="enem">Redação ENEM</option>
                        <option value="ufsc">Redação UFSC</option>
                    </select>
                    <input type="text" id="ufsc-genre-input" placeholder="Gênero (ex: Conto)" style="display: none;">
                </div>
                <button class="submit-btn" id="submit-btn">Enviar para Correção</button>
            </div>

            <div class="loading" id="loading"><div class="spinner"></div><p>Corrigindo... Isso pode levar alguns segundos.</p></div>
            <div class="error-message" id="error-message"></div>

            <div class="result-area" id="result-area">
                <h2 class="result-title">Resultado da Correção</h2>
                <div id="result-content">
                    <div class="empty-state"><i>📝</i><p>Envie uma redação para ver o resultado aqui.</p></div>
                </div>
            </div>
        </div>

        <div class="right-panel">
            <h2>Configurações</h2>
            <div class="api-config">
                <h3>URL Base da API</h3>
                <input type="text" id="api-url" placeholder="ex: http://127.0.0.1:8000">
                <button id="save-api-config">Salvar Configuração</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // --- ELEMENTOS DOM ---
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const uploadTitle = document.getElementById('upload-title');
            const uploadText = document.getElementById('upload-text');
            const submitBtn = document.getElementById('submit-btn');
            const modelSelect = document.getElementById('model-select');
            const ufscGenreInput = document.getElementById('ufsc-genre-input');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('error-message');
            const resultContent = document.getElementById('result-content');
            const redacoesList = document.getElementById('redacoes-list');
            const apiUrlInput = document.getElementById('api-url');
            const saveApiConfigBtn = document.getElementById('save-api-config');
            const toggleUploadBtn = document.getElementById('toggle-upload');
            const toggleTextBtn = document.getElementById('toggle-text');
            const uploadContainer = document.getElementById('upload-container');
            const textInputArea = document.getElementById('text-input-area');

            // --- ESTADO DA APLICAÇÃO ---
            let apiConfig = JSON.parse(localStorage.getItem('apiConfig')) || { url: '' };
            apiUrlInput.value = apiConfig.url;
            let redacoesSalvas = JSON.parse(localStorage.getItem('redacoesSalvas')) || [];
            let currentInputMode = 'upload'; // 'upload' ou 'text'

            // --- FUNÇÕES DE LÓGICA ---
            function showError(mensagem) {
                errorMessage.textContent = mensagem;
                errorMessage.style.display = 'block';
            }

            function salvarRedacoes() {
                localStorage.setItem('redacoesSalvas', JSON.stringify(redacoesSalvas));
            }

            function carregarRedacoes() {
                redacoesList.innerHTML = '';
                if (redacoesSalvas.length === 0) {
                    redacoesList.innerHTML = `<div class="empty-state"><i>📂</i><p>Nenhuma redação salva.</p></div>`;
                    return;
                }
                redacoesSalvas.slice().reverse().forEach(redacao => {
                    const item = document.createElement('div');
                    item.className = 'redacao-item';
                    item.innerHTML = `<h3>${redacao.titulo}</h3><p>Data: ${redacao.data} | Nota: ${typeof redacao.nota === 'number' ? redacao.nota.toFixed(2) : redacao.nota}</p><div class="redacao-actions"><button class="action-btn delete-btn" data-id="${redacao.id}">Apagar</button></div>`;
                    
                    item.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('action-btn')) {
                            document.querySelectorAll('.redacao-item').forEach(el => el.classList.remove('active'));
                            item.classList.add('active');
                            exibirResultado(redacao.resultado);
                        }
                    });
                    
                    item.querySelector('.delete-btn').addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm('Tem certeza que deseja apagar esta redação?')) {
                            apagarRedacao(redacao.id);
                        }
                    });
                    
                    redacoesList.appendChild(item);
                });
            }

            function apagarRedacao(id) {
                redacoesSalvas = redacoesSalvas.filter(redacao => redacao.id !== id);
                salvarRedacoes();
                carregarRedacoes();
                if (document.querySelector('.redacao-item.active') === null) {
                    resultContent.innerHTML = `<div class="empty-state"><i>📝</i><p>Envie uma redação para ver o resultado aqui.</p></div>`;
                }
            }

            function handleFileSelect(file) {
                 if (file) {
                    uploadTitle.textContent = "Arquivo Selecionado";
                    uploadText.textContent = file.name;
                    uploadArea.classList.add('file-selected');
                }
            }

            function exibirResultado(resultado) {
                if (resultado && resultado.competencias) { // ENEM
                    let competenciasHtml = resultado.competencias.map(c => `<div class="criteria-item"><div class="criteria-header"><span class="criteria-name">Competência ${c.id}</span><span class="criteria-score">${c.nota}</span></div><p class="criteria-comment">${c.feedback}</p></div>`).join('');
                    resultContent.innerHTML = `<div class="criteria-item"><div class="criteria-name">Análise Geral</div><p class="criteria-comment">${resultado.analise_geral}</p></div>${competenciasHtml}<div class="total-score">Nota Final: ${resultado.nota_final}</div>`;
                } else if (resultado && resultado.criterios) { // UFSC
                    let criteriosHtml = resultado.criterios.map(c => `<div class="criteria-item"><div class="criteria-header"><span class="criteria-name">${c.nome}</span><span class="criteria-score">${c.nota.toFixed(2)}</span></div><p class="criteria-comment">${c.feedback}</p></div>`).join('');
                     resultContent.innerHTML = `<div class="criteria-item"><div class="criteria-name">Análise Geral</div><p class="criteria-comment">${resultado.analise_geral}</p></div>${criteriosHtml}<div class="total-score">Nota Final: ${resultado.nota_final.toFixed(2)}</div>`;
                } else {
                    resultContent.innerHTML = `<div class="error-message" style="display:block;">Resposta da API em formato inválido.</div>`;
                    console.error("Resposta inválida:", resultado);
                }
            }
            
            // --- EVENT LISTENERS ---

            toggleUploadBtn.addEventListener('click', () => {
                currentInputMode = 'upload';
                toggleUploadBtn.classList.add('active');
                toggleTextBtn.classList.remove('active');
                uploadContainer.style.display = 'block';
                textInputArea.style.display = 'none';
            });
            
            toggleTextBtn.addEventListener('click', () => {
                currentInputMode = 'text';
                toggleTextBtn.classList.add('active');
                toggleUploadBtn.classList.remove('active');
                uploadContainer.style.display = 'none';
                textInputArea.style.display = 'block';
            });

            saveApiConfigBtn.addEventListener('click', function () {
                let url = apiUrlInput.value.trim();
                if (url.endsWith('/')) url = url.slice(0, -1);
                apiConfig = { url: url };
                localStorage.setItem('apiConfig', JSON.stringify(apiConfig));
                alert('Configurações da API salvas!');
            });
            
            modelSelect.addEventListener('change', () => {
                ufscGenreInput.style.display = (modelSelect.value === 'ufsc') ? 'block' : 'none';
            });

            uploadArea.addEventListener('click', () => fileInput.click());
            uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.style.borderColor = 'var(--primary-color)'; });
            uploadArea.addEventListener('dragleave', () => { uploadArea.style.borderColor = 'var(--border-color)'; });
            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--border-color)';
                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    handleFileSelect(e.dataTransfer.files[0]);
                }
            });
            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) handleFileSelect(fileInput.files[0]);
            });

            submitBtn.addEventListener('click', async () => {
                const selectedModel = modelSelect.value;
                if (!apiConfig.url) {
                    showError('URL da API não configurada. Configure no painel direito.');
                    return;
                }

                let requestBody;
                let endpoint = '';
                let headers = {};
                
                if (currentInputMode === 'upload') {
                    const file = fileInput.files[0];
                    if (!file) {
                        showError('Por favor, faça o upload de uma imagem da redação.');
                        return;
                    }
                    requestBody = new FormData();
                    requestBody.append('foto', file);
                    if (selectedModel === 'enem') {
                        endpoint = '/corrigir-redacao-enem/';
                    } else { // UFSC
                        const genero = ufscGenreInput.value.trim();
                        if (!genero) {
                            showError('Por favor, informe o gênero textual para a correção da UFSC.');
                            return;
                        }
                        requestBody.append('genero', genero);
                        endpoint = '/corrigir-redacao-ufsc/';
                    }
                } else { // modo 'text'
                    const texto = textInputArea.value.trim();
                    if (!texto) {
                        showError('Por favor, digite o texto da redação.');
                        return;
                    }
                    headers = { 'Content-Type': 'application/json' };
                    if (selectedModel === 'enem') {
                        endpoint = '/corrigir-texto-enem/';
                        requestBody = JSON.stringify({ texto: texto });
                    } else { // UFSC
                        const genero = ufscGenreInput.value.trim();
                        if (!genero) {
                            showError('Por favor, informe o gênero textual para a correção da UFSC.');
                            return;
                        }
                        endpoint = '/corrigir-texto-ufsc/';
                        requestBody = JSON.stringify({ texto: texto, genero: genero });
                    }
                }
                
                const fullApiUrl = apiConfig.url + endpoint;
                submitBtn.disabled = true;
                loading.style.display = 'block';
                errorMessage.style.display = 'none';
                resultContent.innerHTML = `<div class="empty-state"><i>📝</i><p>Aguardando resultado...</p></div>`;

                try {
                    const response = await fetch(fullApiUrl, { method: 'POST', headers: headers, body: requestBody });
                    if (!response.ok) {
                        const errorData = await response.json();
                        throw new Error(errorData.detail || `Erro na API: ${response.status}`);
                    }
                    const resultado = await response.json();
                    
                    const novaRedacao = {
                        id: Date.now(),
                        titulo: `Redação ${selectedModel.toUpperCase()} de ${new Date().toLocaleDateString()}`,
                        data: new Date().toLocaleDateString(),
                        nota: resultado.nota_final || 0,
                        resultado: resultado,
                        tipo: selectedModel
                    };

                    redacoesSalvas.push(novaRedacao);
                    salvarRedacoes();
                    carregarRedacoes();
                    exibirResultado(resultado);

                    const primeiroItem = redacoesList.querySelector('.redacao-item');
                    if (primeiroItem) {
                        document.querySelectorAll('.redacao-item').forEach(el => el.classList.remove('active'));
                        primeiroItem.classList.add('active');
                    }

                } catch (error) {
                    showError(`Erro ao processar: ${error.message}`);
                    console.error('Erro detalhado:', error);
                    resultContent.innerHTML = `<div class="empty-state"><i>❌</i><p>Ocorreu um erro.</p></div>`;
                } finally {
                    submitBtn.disabled = false;
                    loading.style.display = 'none';
                }
            });

            // --- INICIALIZAÇÃO ---
            carregarRedacoes();
        });
    </script>
</body>
</html>
