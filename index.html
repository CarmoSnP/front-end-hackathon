<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corretor de Redação ENEM</title>
    <style>
        :root {
            --primary-color: #4a6fa5;
            --secondary-color: #6b8cbc;
            --light-color: #f5f7fa;
            --dark-color: #333;
            --border-color: #ddd;
            --success-color: #28a745;
            --warning-color: #ffc107;
            --error-color: #dc3545;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: var(--dark-color);
            line-height: 1.6;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        /* Painel Esquerdo - Lista de Redações */
        .left-panel {
            width: 25%;
            background-color: white;
            border-right: 1px solid var(--border-color);
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .left-panel h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .redacoes-container {
            flex: 1;
            overflow-y: auto;
        }

        .redacao-item {
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .redacao-item:hover {
            background-color: #f0f4f8;
        }

        .redacao-item.active {
            border-color: var(--primary-color);
            background-color: #e8f0fe;
        }

        .redacao-item h3 {
            font-size: 16px;
            margin-bottom: 5px;
        }

        .redacao-item p {
            font-size: 14px;
            color: #666;
        }

        .redacao-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
            gap: 8px;
        }

        .action-btn {
            padding: 5px 10px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: background-color 0.3s ease;
        }

        .delete-btn {
            background-color: var(--error-color);
            color: white;
        }

        .reprocess-btn {
            background-color: var(--warning-color);
            color: var(--dark-color);
        }

        /* Painel Central - Chat e Correção */
        .center-panel {
            flex: 1;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 20px;
            background-color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .upload-area:hover {
            border-color: var(--primary-color);
        }

        .upload-area i {
            font-size: 48px;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        .text-input {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 20px;
            resize: vertical;
            font-size: 16px;
        }

        .options-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .model-select {
            padding: 10px 15px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            background-color: white;
            font-size: 16px;
        }

        .submit-btn {
            padding: 10px 20px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s ease;
        }

        .submit-btn:hover {
            background-color: var(--secondary-color);
        }

        .submit-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .result-area {
            flex: 1;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            background-color: white;
            overflow-y: auto;
        }

        .result-title {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .criteria-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        .criteria-item:last-child {
            border-bottom: none;
        }

        .criteria-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .criteria-score {
            display: inline-block;
            padding: 3px 8px;
            background-color: var(--primary-color);
            color: white;
            border-radius: 3px;
            font-size: 14px;
            margin-left: 10px;
        }

        .criteria-comment {
            margin-top: 8px;
            font-size: 14px;
            color: #555;
        }

        .total-score {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 2px solid var(--border-color);
            font-size: 18px;
            font-weight: bold;
        }

        /* Painel Direito - Configurações */
        .right-panel {
            width: 25%;
            background-color: white;
            border-left: 1px solid var(--border-color);
            padding: 20px;
        }

        .right-panel h2 {
            margin-bottom: 15px;
            color: var(--primary-color);
        }

        .config-option {
            margin-bottom: 15px;
        }

        .config-option label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }

        .config-option select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
        }

        /* Loading e Estados */
        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-left-color: var(--primary-color);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error-message {
            color: var(--error-color);
            padding: 10px;
            background-color: #f8d7da;
            border-radius: 5px;
            margin-bottom: 15px;
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: #666;
        }

        .empty-state i {
            font-size: 48px;
            margin-bottom: 15px;
            display: block;
        }

        .api-config {
            margin-top: 20px;
            padding: 15px;
            background-color: #f8f9fa;
            border-radius: 5px;
        }

        .api-config h3 {
            margin-bottom: 10px;
            font-size: 16px;
        }

        .api-config input {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid var(--border-color);
            border-radius: 5px;
            margin-bottom: 10px;
        }

        .api-config button {
            padding: 8px 15px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Painel Esquerdo - Lista de Redações -->
        <div class="left-panel">
            <h2>Minhas Redações</h2>
            <div class="redacoes-container" id="redacoes-list">
                <!-- As redações serão adicionadas dinamicamente aqui -->
            </div>
        </div>

        <!-- Painel Central - Chat e Correção -->
        <div class="center-panel">
            <div class="upload-area" id="upload-area">
                <i>📄</i>
                <h3>Fazer upload de uma redação</h3>
                <p>Arraste um arquivo aqui ou clique para selecionar</p>
                <input type="file" id="file-input" accept=".txt,.pdf,.doc,.docx" style="display: none;">
            </div>

            <textarea class="text-input" id="text-input" placeholder="Ou digite sua redação aqui..."></textarea>

            <div class="options-bar">
                <select class="model-select" id="model-select">
                    <option value="enem">Redação ENEM</option>
                    <option value="outros">Outros Modelos</option>
                </select>
                <button class="submit-btn" id="submit-btn">Enviar para Correção</button>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Processando sua redação...</p>
            </div>

            <div class="error-message" id="error-message"></div>

            <div class="result-area" id="result-area">
                <h2 class="result-title">Resultado da Correção</h2>
                <div id="result-content">
                    <div class="empty-state">
                        <i>📝</i>
                        <p>Envie uma redação para ver o resultado da correção aqui.</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Painel Direito - Configurações -->
        <div class="right-panel">
            <h2>Configurações</h2>
            <div class="config-option">
                <label for="tipo-redacao">Tipo de Redação:</label>
                <select id="tipo-redacao">
                    <option value="enem">ENEM</option>
                    <option value="vestibular">Vestibular</option>
                    <option value="concursos">Concursos</option>
                </select>
            </div>
            <div class="config-option">
                <label for="nivel-detalhe">Nível de Detalhe:</label>
                <select id="nivel-detalhe">
                    <option value="basico">Básico</option>
                    <option value="detalhado" selected>Detalhado</option>
                    <option value="completo">Completo</option>
                </select>
            </div>
            <div class="config-option">
                <label for="foco-correcao">Foco da Correção:</label>
                <select id="foco-correcao">
                    <option value="geral" selected>Geral</option>
                    <option value="gramatica">Gramática</option>
                    <option value="estrutura">Estrutura Textual</option>
                    <option value="argumentacao">Argumentação</option>
                </select>
            </div>

            <div class="api-config">
                <h3>Configuração da API</h3>
                <input type="text" id="api-url" placeholder="URL da API (ex: https://sua-api.com/corrigir)">
                <input type="text" id="api-key" placeholder="Chave da API (opcional)">
                <button id="save-api-config">Salvar Configuração</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Elementos DOM
            const uploadArea = document.getElementById('upload-area');
            const fileInput = document.getElementById('file-input');
            const textInput = document.getElementById('text-input');
            const submitBtn = document.getElementById('submit-btn');
            const modelSelect = document.getElementById('model-select');
            const loading = document.getElementById('loading');
            const errorMessage = document.getElementById('error-message');
            const resultContent = document.getElementById('result-content');
            const redacoesList = document.getElementById('redacoes-list');
            const tipoRedacaoSelect = document.getElementById('tipo-redacao');
            const nivelDetalheSelect = document.getElementById('nivel-detalhe');
            const focoCorrecaoSelect = document.getElementById('foco-correcao');
            const apiUrlInput = document.getElementById('api-url');
            const apiKeyInput = document.getElementById('api-key');
            const saveApiConfigBtn = document.getElementById('save-api-config');

            // Configurações da API
            let apiConfig = JSON.parse(localStorage.getItem('apiConfig')) || {
                url: '',
                key: ''
            };

            // Carregar configurações da API
            apiUrlInput.value = apiConfig.url;
            apiKeyInput.value = apiConfig.key;

            // Salvar configurações da API
            saveApiConfigBtn.addEventListener('click', function () {
                apiConfig = {
                    url: apiUrlInput.value.trim(),
                    key: apiKeyInput.value.trim()
                };
                localStorage.setItem('apiConfig', JSON.stringify(apiConfig));
                alert('Configurações da API salvas com sucesso!');
            });

            // Dados das redações (do localStorage)
            let redacoesSalvas = JSON.parse(localStorage.getItem('redacoesSalvas')) || [];

            // Função para salvar redações no localStorage
            function salvarRedacoes() {
                localStorage.setItem('redacoesSalvas', JSON.stringify(redacoesSalvas));
            }

            // Carregar lista de redações
            function carregarRedacoes() {
                redacoesList.innerHTML = '';

                if (redacoesSalvas.length === 0) {
                    redacoesList.innerHTML = `
                        <div class="empty-state">
                            <i>📝</i>
                            <p>Nenhuma redação salva ainda.</p>
                        </div>
                    `;
                    return;
                }

                redacoesSalvas.forEach(redacao => {
                    const item = document.createElement('div');
                    item.className = 'redacao-item';
                    item.innerHTML = `
                        <h3>${redacao.titulo}</h3>
                        <p>Data: ${redacao.data} | Nota: ${redacao.nota}</p>
                        <div class="redacao-actions">
                            <button class="action-btn reprocess-btn" data-id="${redacao.id}">Corrigir Novamente</button>
                            <button class="action-btn delete-btn" data-id="${redacao.id}">Apagar</button>
                        </div>
                    `;

                    // Evento para visualizar a correção
                    item.addEventListener('click', (e) => {
                        if (!e.target.classList.contains('action-btn')) {
                            document.querySelectorAll('.redacao-item').forEach(el => el.classList.remove('active'));
                            item.classList.add('active');
                            exibirResultado(redacao.resultado);
                            textInput.value = redacao.texto;
                            modelSelect.value = redacao.modelo;
                        }
                    });

                    // Evento para apagar redação
                    const deleteBtn = item.querySelector('.delete-btn');
                    deleteBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        if (confirm('Tem certeza que deseja apagar esta redação?')) {
                            apagarRedacao(redacao.id);
                        }
                    });

                    // Evento para reprocessar redação
                    const reprocessBtn = item.querySelector('.reprocess-btn');
                    reprocessBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        reprocessarRedacao(redacao);
                    });

                    redacoesList.appendChild(item);
                });
            }

            // Apagar redação
            function apagarRedacao(id) {
                redacoesSalvas = redacoesSalvas.filter(redacao => redacao.id !== id);
                salvarRedacoes();
                carregarRedacoes();

                // Limpar área de resultado se a redação apagada estava sendo visualizada
                if (document.querySelector('.redacao-item.active') === null) {
                    resultContent.innerHTML = `
                        <div class="empty-state">
                            <i>📝</i>
                            <p>Envie uma redação para ver o resultado da correção aqui.</p>
                        </div>
                    `;
                    textInput.value = '';
                }
            }

            // Reprocessar redação
            function reprocessarRedacao(redacao) {
                // Preencher os campos com os dados da redação
                textInput.value = redacao.texto;
                modelSelect.value = redacao.modelo;

                // Enviar para correção novamente
                submitBtn.click();
            }

            // Inicializar lista de redações
            carregarRedacoes();

            // Upload de arquivo
            uploadArea.addEventListener('click', () => {
                fileInput.click();
            });

            uploadArea.addEventListener('dragover', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--primary-color)';
                uploadArea.style.backgroundColor = '#f0f4f8';
            });

            uploadArea.addEventListener('dragleave', () => {
                uploadArea.style.borderColor = 'var(--border-color)';
                uploadArea.style.backgroundColor = 'white';
            });

            uploadArea.addEventListener('drop', (e) => {
                e.preventDefault();
                uploadArea.style.borderColor = 'var(--border-color)';
                uploadArea.style.backgroundColor = 'white';

                if (e.dataTransfer.files.length) {
                    fileInput.files = e.dataTransfer.files;
                    processarArquivo(e.dataTransfer.files[0]);
                }
            });

            fileInput.addEventListener('change', () => {
                if (fileInput.files.length) {
                    processarArquivo(fileInput.files[0]);
                }
            });

            function processarArquivo(file) {
                const reader = new FileReader();
                reader.onload = function (e) {
                    textInput.value = e.target.result;
                };
                reader.readAsText(file);
            }

            // Função para enviar para a API real
            async function enviarParaCorrecao(texto, modelo, tipoRedacao, nivelDetalhe, focoCorrecao) {
                // Verificar se a URL da API está configurada
                if (!apiConfig.url) {
                    throw new Error('URL da API não configurada. Configure no painel direito.');
                }

                // Dados que serão enviados para a API
                const dadosEnvio = {
                    texto: texto,
                    modelo: modelo,
                    tipo_redacao: tipoRedacao,
                    nivel_detalhe: nivelDetalhe,
                    foco_correcao: focoCorrecao
                };

                // Configurar headers
                const headers = {
                    'Content-Type': 'application/json'
                };

                // Adicionar API key se fornecida
                if (apiConfig.key) {
                    headers['Authorization'] = `Bearer ${apiConfig.key}`;
                }

                // Fazer a requisição POST para a API
                const response = await fetch(apiConfig.url, {
                    method: 'POST',
                    headers: headers,
                    body: JSON.stringify(dadosEnvio)
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`Erro na API: ${response.status} - ${errorText}`);
                }

                // Retornar o JSON da resposta da API
                return await response.json();
            }

            // Enviar para correção
            submitBtn.addEventListener('click', async () => {
                const texto = textInput.value.trim();
                const modelo = modelSelect.value;
                const tipoRedacao = tipoRedacaoSelect.value;
                const nivelDetalhe = nivelDetalheSelect.value;
                const focoCorrecao = focoCorrecaoSelect.value;

                if (!texto) {
                    showError('Por favor, digite ou envie uma redação para correção.');
                    return;
                }

                // Desabilitar botão e mostrar loading
                submitBtn.disabled = true;
                loading.style.display = 'block';
                errorMessage.style.display = 'none';

                try {
                    // CHAMADA REAL DA API
                    const resultado = await enviarParaCorrecao(texto, modelo, tipoRedacao, nivelDetalhe, focoCorrecao);

                    // Criar objeto da redação com a resposta da API
                    const novaRedacao = {
                        id: Date.now(), // ID único baseado no timestamp
                        titulo: `Redação ${new Date().toLocaleDateString()}`,
                        data: new Date().toLocaleDateString(),
                        nota: resultado.notaTotal || resultado.nota_final || resultado.pontuacao || 0,
                        texto: texto,
                        modelo: modelo,
                        resultado: resultado,
                        configuracao: {
                            tipoRedacao: tipoRedacao,
                            nivelDetalhe: nivelDetalhe,
                            focoCorrecao: focoCorrecao
                        }
                    };

                    // Adicionar à lista e salvar
                    redacoesSalvas.push(novaRedacao);
                    salvarRedacoes();
                    carregarRedacoes();

                    // Exibir resultado
                    exibirResultado(resultado);

                    // Selecionar a nova redação na lista
                    const novaItem = document.querySelector(`.redacao-item:last-child`);
                    if (novaItem) {
                        document.querySelectorAll('.redacao-item').forEach(el => el.classList.remove('active'));
                        novaItem.classList.add('active');
                    }
                } catch (error) {
                    showError(`Erro ao processar a redação: ${error.message}`);
                    console.error('Erro detalhado:', error);
                } finally {
                    // Reabilitar botão e esconder loading
                    submitBtn.disabled = false;
                    loading.style.display = 'none';
                }
            });

            function showError(mensagem) {
                errorMessage.textContent = mensagem;
                errorMessage.style.display = 'block';
            }

            // Exibir resultado da correção (adaptável para diferentes estruturas de API)
            function exibirResultado(resultado) {
                // Verificar a estrutura da resposta e adaptar
                const notaTotal = resultado.notaTotal || resultado.nota_final || resultado.pontuacao || 0;

                let html = `
                    <div class="total-score">
                        Nota Total: ${notaTotal} pontos
                    </div>
                `;

                // Verificar se os critérios vêm em formato de array ou objeto
                let criterios = resultado.criterios || resultado.competencias || [];

                // Se for um objeto, converter para array
                if (!Array.isArray(criterios) && typeof criterios === 'object') {
                    criterios = Object.values(criterios);
                }

                if (Array.isArray(criterios) {
                    criterios.forEach(criterio => {
                        const nome = criterio.nome || criterio.competencia || criterio.criterio || 'Critério';
                        const nota = criterio.nota || criterio.pontuacao || criterio.score || 0;
                        const comentario = criterio.comentario || criterio.observacao || criterio.feedback || 'Sem comentário.';

                        html += `
                            <div class="criteria-item">
                                <div class="criteria-name">
                                    ${nome}
                                    <span class="criteria-score">${nota} pontos</span>
                                </div>
                                <div class="criteria-comment">${comentario}</div>
                            </div>
                        `;
                    });
                }

                // Comentário geral
                const comentarioGeral = resultado.comentarioGeral || resultado.comentario_geral ||
                    resultado.feedback_geral || resultado.observacoes ||
                    'Sem comentário geral.';

                html += `
                    <div class="criteria-item">
                        <div class="criteria-name">Comentário Geral</div>
                        <div class="criteria-comment">${comentarioGeral}</div>
                    </div>
                `;

                // Sugestões de melhoria
                let sugestoes = resultado.sugestoes || resultado.sugestoes_melhoria || [];

                // Se for uma string, tentar dividir por quebras de linha
                if (typeof sugestoes === 'string') {
                    sugestoes = sugestoes.split('\n').filter(s => s.trim());
                }

                if (Array.isArray(sugestoes) && sugestoes.length > 0) {
                    html += `
                        <div class="criteria-item">
                            <div class="criteria-name">Sugestões de Melhoria</div>
                            <div class="criteria-comment">
                                <ul>
                                    ${sugestoes.map(sugestao => `<li>${sugestao}</li>`).join('')}
                                </ul>
                            </div>
                        </div>
                    `;
                }

                resultContent.innerHTML = html;
            }
        });
    </script>
</body>

</html>
